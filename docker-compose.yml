services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docplatform
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
  api:
    build: .
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/docplatform
      STORAGE_DIR: /app/storage
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]
    volumes: [filestore:/app/storage]
volumes:
  pgdata:
  filestore:
